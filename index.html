<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comercial Faro Sur · Catálogo de Productos</title>
  <meta name="description" content="Tienda de variedades con productos importados de China: hogar, tecnología, belleza, juguetes, regalos y mucho más. Comercial Faro Sur.">
  <meta name="theme-color" content="#0F2E3E">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%230F2E3E'/%3E%3Cpath d='M24 16 8 10v6l16 6z' fill='%23E9A13B'/%3E%3Cpath d='M24 16l16-6v6l-16 6z' fill='%23E9A13B' opacity='.6'/%3E%3Cpath d='M20 18h8l3 18H17z' fill='%23fff'/%3E%3Cpath d='M18 39h12v3H18z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <noscript>
    <div style="max-width:640px;margin:40px auto;padding:20px;font-family:system-ui,sans-serif;color:#17272f">
      <h1>Comercial Faro Sur</h1>
      <p>Esta página necesita JavaScript activado para mostrar el catálogo y el editor.</p>
    </div>
  </noscript>

  <button id="editToggle" class="edit-toggle" type="button">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
    </svg>
    Editar página
  </button>

  <div class="edit-hint" id="editHint" aria-hidden="true">
    <span class="hint-dot"></span>
    <span class="hint-text">Modo edición: haz clic en cualquier texto para cambiarlo</span>
    <button type="button" class="hint-btn" data-open-panel>Abrir editor</button>
    <button type="button" class="hint-btn ghost" data-exit-edit>Salir</button>
  </div>

  <aside id="panel" class="panel" aria-hidden="true" inert aria-label="Editor de la página">
    <div class="panel-head">
      <div>
        <span class="panel-kicker">Comercial Faro Sur</span>
        <h2>Editor de la página</h2>
      </div>
      <button class="icon-btn" type="button" data-panel-close aria-label="Cerrar editor">✕</button>
    </div>
    <nav class="panel-tabs" id="panelTabs" aria-label="Secciones del editor"></nav>
    <div class="panel-body" id="panelBody"></div>
    <div class="panel-foot">
      <span class="autosave-note">Guardado automático</span>
      <div class="panel-foot-actions">
        <button class="btn btn-ghost" type="button" data-export-json>Descargar JSON</button>
        <button class="btn btn-primary" type="button" data-panel-close>Listo</button>
      </div>
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
